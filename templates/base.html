<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

  {% for font_url in google_fonts_urls | default([]) %}
  @import url('{{ font_url }}');
  {% endfor %}

  {% if custom_font_url %}
  @font-face {
    font-family: 'CustomFont';
    src: url('{{ custom_font_url }}');
  }
  {% endif %}

  :root {
    --font-sans: 'Pretendard', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-display: 'Helvetica Neue', Helvetica, 'Pretendard', sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: {{ width }}px;
    height: {{ height }}px;
    overflow: hidden;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  {% block style %}{% endblock %}
</style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
