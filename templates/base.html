<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  {% for font_url in google_fonts_urls | default([]) %}
  @import url('{{ font_url }}');
  {% endfor %}

  {% if custom_font_url %}
  @font-face {
    font-family: 'CustomFont';
    src: url('{{ custom_font_url }}');
  }
  {% endif %}

  :root {
    /* 폰트 시스템 — 시스템 설치 폰트 사용 */
    --font-sans: 'Pretendard', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-serif: 'Noto Serif CJK KR', Georgia, serif;
    --font-display: 'Helvetica Neue', Helvetica, 'Pretendard', Arial, sans-serif;

    /* 기본 색상 */
    --color-black: #0a0a0a;
    --color-white: #ffffff;
    --color-gray: #888888;
    --color-light: #f5f3f0;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: {{ width }}px;
    height: {{ height }}px;
    overflow: hidden;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  {% block style %}{% endblock %}
</style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
