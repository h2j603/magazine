<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

  @font-face {
    font-family: 'SunBatang';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_eight@1.0/SunBatang-Light.woff') format('woff');
    font-weight: 300;
    font-style: normal;
  }

  @font-face {
    font-family: 'SunBatang';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_eight@1.0/SunBatang-Medium.woff') format('woff');
    font-weight: 500;
    font-style: normal;
  }

  @font-face {
    font-family: 'SunBatang';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_eight@1.0/SunBatang-Bold.woff') format('woff');
    font-weight: 700;
    font-style: normal;
  }

  {% for font_url in google_fonts_urls | default([]) %}
  @import url('{{ font_url }}');
  {% endfor %}

  {% if custom_font_url %}
  @font-face {
    font-family: 'CustomFont';
    src: url('{{ custom_font_url }}');
  }
  {% endif %}

  :root {
    /* 폰트 시스템 */
    --font-sans: 'Pretendard', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-serif: 'SunBatang', Georgia, serif;
    --font-display: 'Helvetica Neue', Helvetica, 'Pretendard', sans-serif;

    /* 기본 색상 */
    --color-black: #0a0a0a;
    --color-white: #ffffff;
    --color-gray: #888888;
    --color-light: #f5f3f0;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: {{ width }}px;
    height: {{ height }}px;
    overflow: hidden;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  {% block style %}{% endblock %}
</style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
