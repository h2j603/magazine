<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  {% for font_url in google_fonts_urls | default([]) %}
  @import url('{{ font_url }}');
  {% endfor %}

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: {{ width }}px;
    height: {{ height }}px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  {% if custom_font_url %}
  @font-face {
    font-family: 'CustomFont';
    src: url('{{ custom_font_url }}');
  }
  {% endif %}

  {% block style %}{% endblock %}
</style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
